    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>

        #map { height: 100vh; width: 100vw; background-color: #1e293b; }
        .control-panel { position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(15, 23, 42, 0.9); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); max-height: 90vh; overflow-y: auto; width: 300px; }
        select { width: 100%; padding: 8px; margin-bottom: 10px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 4px; }
        .info-box { font-size: 13px; color: #cbd5e1; }
        .info-box span { font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="control-panel">
    <h3 style="margin-top:0; color:#38bdf8;">Network Explorer: GLOBAL</h3>
    <label>Select Metric / Threshold:</label>
    <select id="metricSelect"></select>
    
    <div class="info-box" id="graphStats">
        Please select a network to view.
    </div>
</div>

ource": "AFG_Bamyan", "target": "AFG_Badakhshan", "weight": 0.3985971957570307, "lag": 3}], "is_directed": true}};
    var currentLayers = [];
    var currentDecorators = [];
    
    var select = document.getElementById('metricSelect');
    select.innerHTML = '<option value="">-- Choose a Network --</option>';
    for(var key in db) {
        var opt = document.createElement('option');
        opt.value = key; opt.innerHTML = key;
        select.appendChild(opt);
    }
    
    function clearMap() {
        currentLayers.forEach(l => map.removeLayer(l));
        currentDecorators.forEach(d => map.removeLayer(d));
        currentLayers = [];
        currentDecorators = [];
    }
    
    function drawGraph(key) {
        var graph = db[key];
        if(!graph) return;
        
        var nodeMap = {};
        graph.nodes.forEach(n => {
            nodeMap[n.id] = [n.lat, n.lon];
            var marker = L.circleMarker([n.lat, n.lon], {
                radius: 5, color: '#0ea5e9', fillColor: '#0ea5e9', fillOpacity: 0.8
            }).bindPopup("<b>"+n.id+"</b>");
            marker.addTo(map);
            currentLayers.push(marker);
        });
        
        graph.edges.forEach(e => {
            var latlngs = [nodeMap[e.source], nodeMap[e.target]];
            var isSTE = key.includes('STE');
            var isPearson = key.includes('Pearson');
            var color = isSTE ? '#ef4444' : (isPearson ? '#3b82f6' : '#22c55e');
            
            var polyline = L.polyline(latlngs, {color: color, weight: Math.max(1, e.weight * 5), opacity: 0.5}).addTo(map);
            polyline.bindPopup(e.source + " &rarr; " + e.target + "<br>Weight: " + e.weight.toFixed(3) + "<br>Lag: " + e.lag + " months");
            currentLayers.push(polyline);
            
            if(graph.is_directed) {
                var decorator = L.polylineDecorator(polyline, {
                    patterns: [
                        {offset: '100%', repeat: 0, symbol: L.Symbol.arrowHead({pixelSize: 10, polygon: false, pathOptions: {stroke: true, color: color, weight: 2}})}
                    ]
                }).addTo(map);
                currentDecorators.push(decorator);
            }
        });
    }
    
    function loadNetwork(key) {
        clearMap();
        if(key === "") {
            document.getElementById('graphStats').innerHTML = "Select a network metric from the dropdown above.";
        } else {
            drawGraph(key);
            var g = db[key];
            if(g.nodes.length > 0) {
                var bounds = new L.LatLngBounds(g.nodes.map(n => [n.lat, n.lon]));
                map.fitBounds(bounds, {padding: [50, 50]});
            }
            document.getElementById('graphStats').innerHTML = "<span>Nodes:</span> " + g.nodes.length + "<br><span>Edges:</span> " + g.edges.length + "<br><span>Directed:</span> " + (g.is_directed ? "Yes" : "No");
        }
    }
    
    select.addEventListener('change', function(e) {
        loadNetwork(e.target.value);
    });
    
</script>
</body>
</html>
