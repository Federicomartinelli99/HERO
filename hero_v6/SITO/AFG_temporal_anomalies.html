                    z: matrixData,
                    x: allDates,
                    y: provList,
                    type: 'heatmap',
                    colorscale: [

                        [0.10, '#4575b4'],   // Blue
                        [0.20, '#74add1'],   // Light Blue
                        [0.30, '#abd9e9'],   // Pale Blue
                        [0.40, '#e0f3f8'],   // Very Pale Blue / Soft Cool White
                        [0.50, '#f8fafc'],   // Neutral Slate / White (0 Z - Norm)
                        [0.60, '#fee090'],   // Pale Yellow/Orange
                        [0.70, '#fdae61'],   // Light Orange

                        bgcolor: 'rgba(15, 23, 42, 0.75)'
                    }
                };

            }

            function filterHeatmap(query) {
                if (!query || !query.trim()) {
                    renderHeatmap(allProvinces, allZMatrix);
                    return;
                }
                const q = query.trim().toLowerCase();
                const filteredProv = [];
                const filteredMat = [];
                for (let i = 0; i < allProvinces.length; i++) {
                    if (allProvinces[i].toLowerCase().includes(q)) {
                        filteredProv.push(allProvinces[i]);
                        filteredMat.push(allZMatrix[i]);
                    }
                }
                renderHeatmap(filteredProv, filteredMat);
            }

            function resetFilter() {
                const input = document.getElementById("regionFilter");
                if (input) input.value = "";
                renderHeatmap(allProvinces, allZMatrix);
            }

            document.addEventListener("DOMContentLoaded", () => {
                renderHeatmap(allProvinces, allZMatrix);
            });

    <script>
        
        function downloadCSVData() {
            let csvContent = "data:text/csv;charset=utf-8,Province," + allDates.join(",") + "\n";
            for (let i = 0; i < allProvinces.length; i++) {
                const rowVals = allZMatrix[i].map(val => val !== null ? val : "");
                csvContent += `"${allProvinces[i]}",` + rowVals.join(",") + "\n";
            }
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "AFG_temporal_anomalies_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
